<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TwinMind AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #2563eb
    );
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:40px;
    color:white;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-size:2.5rem;
    font-weight:700;
}

.header p{
    color:#d1d5db;
    margin-top:10px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:8px;
    font-weight:500;
}

input{
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:15px;
}

input::placeholder{
    color:#d1d5db;
}

.predict-btn{
    width:100%;
    margin-top:30px;
    padding:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(
        90deg,
        #06b6d4,
        #2563eb
    );
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.predict-btn:hover{
    transform:translateY(-3px);
}

.result-card{
    margin-top:30px;
    background:rgba(255,255,255,0.1);
    border-radius:20px;
    padding:25px;
    text-align:center;
}

.result-card h2{
    margin-bottom:10px;
}

.score{
    font-size:3rem;
    font-weight:bold;
    color:#22c55e;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:2rem;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>🧠 TwinMind AI</h1>
        <p>Digital Twin of Human Learning</p>
    </div>

    <div class="form-grid">

        <div class="input-group">
            <label>Study Hours / Day</label>
            <input type="number" id="study" placeholder="Example: 5">
        </div>

        <div class="input-group">
            <label>Attendance %</label>
            <input type="number" id="attendance" placeholder="Example: 85">
        </div>

        <div class="input-group">
            <label>Sleep Hours</label>
            <input type="number" id="sleep" placeholder="Example: 7">
        </div>

        <div class="input-group">
            <label>Mental Health Rating (1-10)</label>
            <input type="number" id="mental" placeholder="Example: 8">
        </div>

    </div>

    <button class="predict-btn" onclick="predictScore()">
        Predict Performance
    </button>

    <div class="result-card">

        <h2>Predicted Exam Score</h2>

        <div class="score" id="result">
            --
        </div>

    </div>

</div>

<script>

async function predictScore(){

    try{

        let study=document.getElementById("study").value;
        let attendance=document.getElementById("attendance").value;
        let sleep=document.getElementById("sleep").value;
        let mental=document.getElementById("mental").value;

        let url = `http://127.0.0.1:8000/predict?study_hours_per_day=${study}&attendance_percentage=${attendance}&sleep_hours=${sleep}&mental_health_rating=${mental}`;

        let response=await fetch(url);

        let data=await response.json();

        document.getElementById("result").innerHTML=
        data.predicted_exam_score;

    }

    catch(error){

        document.getElementById("result").innerHTML=
        "Error";

    }

}

</script>

</body>
</html>
